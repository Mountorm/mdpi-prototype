<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUSY-8874 API</title>
  <link rel="icon" type="image/png" href="./assets/swagger-ui/favicon-32x32.png">
  <link rel="stylesheet" href="./assets/swagger-ui/swagger-ui.css">
  <style>
    body { margin: 0; background: #fafafa; }
    .topbar { display: none; }
    #error {
      display: none;
      margin: 40px auto;
      max-width: 640px;
      padding: 20px 24px;
      background: #fff;
      border: 1px solid #e8ecf1;
      border-left: 4px solid #d32f2f;
      border-radius: 4px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.7;
      color: #1a1a2e;
    }
    #error code {
      font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
      background: #f5f7fa;
      padding: 1px 5px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <div id="error">
    <strong>接口文档加载失败</strong><br>
    浏览器不允许直接双击打开时读取本地 <code>openapi.yaml</code>。请在 susy-8874 目录下起一个本地静态服务，例如：<br>
    <code>npx serve .</code> 或 <code>python -m http.server 8080</code><br>
    然后访问 <code>http://localhost:8080/</code>。部署到 <code>susy-8874.mdpi.cloud</code> 后不受此限制。
  </div>

  <script src="./assets/swagger-ui/swagger-ui-bundle.js"></script>
  <script src="./assets/swagger-ui/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function () {
      fetch('./openapi.yaml')
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          SwaggerUIBundle({
            url: './openapi.yaml',
            dom_id: '#swagger-ui',
            deepLinking: true,
            docExpansion: 'list',
            defaultModelsExpandDepth: 1,
            persistAuthorization: true,
            tryItOutEnabled: false,
            presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
            layout: 'BaseLayout'
          });
        })
        .catch(function (err) {
          console.error(err);
          document.getElementById('error').style.display = 'block';
        });
    };
  </script>
</body>
</html>
